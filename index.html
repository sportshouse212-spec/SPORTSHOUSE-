<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পেমেন্ট স্ট্যাটাস</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Red Header Bar */
    .header {
      width: 100%;
      background-color: #a71d2a;
      color: #ffffff;
      padding: 14px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* Content Area */
    .content-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
      width: 100%;
    }

    /* Red Circle Cross Icon */
    .status-icon-failed {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background-color: #d93025;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(217, 48, 37, 0.25);
    }

    /* Red Border Message Box */
    .failed-box {
      background-color: #fdf2f2;
      border: 1px solid #f8b4b4;
      border-radius: 10px;
      padding: 20px 16px;
      width: 90%;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .failed-text {
      color: #9b1c1c;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Bar -->
    <div class="header">
      পেমেন্ট স্ট্যাটাস
    </div>

    <!-- Main Content -->
    <div class="content-view">
      <!-- Cross Icon -->
      <div class="status-icon-failed">✕</div>

      <!-- Alert Message Box -->
      <div class="failed-box">
        <div class="failed-text">
          আপনার টাইম শেষ
        </div>
      </div>
    </div>
  </div>

</body>
</html>
